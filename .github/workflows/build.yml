name: Build SmartWindowAI

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_mingw
          modules: qtcharts
          add-tools-to-path: true

      - name: Add Qt MinGW to PATH
        shell: pwsh
        run: |
          $mingwPath = Get-ChildItem -Path "D:\a\SmartWindowAI\Qt\Tools" -Filter "mingw*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          echo "$($mingwPath.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added to PATH: $($mingwPath.FullName)\bin"

      - name: Verify Files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse

      - name: Build
        shell: cmd
        run: |
          qmake SmartWindowAI.pro -spec win32-g++
          mingw32-make

      - name: Find EXE
        shell: pwsh
        run: |
          Get-ChildItem -Recurse *.exe

      - name: Deploy Qt Dependencies
        shell: pwsh
        run: |
          windeployqt release\SmartWindowAI.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartWindowAI-Windows
          path: release\
