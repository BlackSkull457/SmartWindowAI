name: Build SmartWindowAI

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_mingw
          modules: qtcharts
          add-tools-to-path: true

      - name: Add Qt MinGW to PATH
        shell: pwsh
        run: |
          $toolsDir = $env:IQTA_TOOLS
          Write-Host "IQTA_TOOLS: $toolsDir"
          $mingwPath = Get-ChildItem -Path $toolsDir -Filter "mingw*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "MinGW found: $($mingwPath.FullName)\bin"
          # Prepend Qt MinGW to PATH so it takes priority over any system MinGW
          $newPath = "$($mingwPath.FullName)\bin;" + $env:PATH
          echo "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Compiler
        shell: cmd
        run: |
          where g++
          g++ --version

      - name: Verify Files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse

      - name: Build
        shell: cmd
        run: |
          qmake SmartWindowAI.pro -spec win32-g++
          mingw32-make

      - name: Find EXE
        shell: pwsh
        run: |
          Get-ChildItem -Recurse *.exe

      - name: Deploy Qt Dependencies
        shell: cmd
        run: |
          windeployqt release\SmartWindowAI.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartWindowAI-Windows
          path: release\
