name: Build SmartWindowAI

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make
          update: false

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_mingw

      - name: Verify Files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse

      - name: Build
        shell: cmd
        run: |
          qmake SmartWindowAI.pro -spec win32-g++
          mingw32-make

      - name: Find EXE
        shell: pwsh
        run: |
          Get-ChildItem -Recurse *.exe

      - name: Deploy Qt Dependencies
        shell: cmd
        run: |
          windeployqt SmartWindowAI.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartWindowAI-Windows
          path: SmartWindowAI.exe
